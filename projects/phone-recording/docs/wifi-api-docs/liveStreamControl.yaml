openapi: 3.0.1
info:
  title: Livestream Control API
  description: API for controlling Livestreams on Blackmagic Design products.
  version: 1.2.0
servers:
  - url: /control/api/v1
tags:
  - name: Livestream
    description: Livestream Control API
paths:
  /livestreams/0:
    get:
      operationId: getLivestreamStatus
      summary: Get the livestream's current status.
      description: Returns the current status, bitrate, format, duration, and cache usage of the livestream.
      tags:
        - Livestream
      responses:
        200:
          description: Livestream's current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivestreamStatus"
        501:
          description: Not implemented for this device.
  /livestreams/0/start:
    get:
      operationId: getLivestreamStart
      summary: Determine if the livestream is active.
      description: Returns true if the livestream is currently running.
      tags:
        - Livestream
      responses:
        200:
          description: Livestream active status.
          content:
            application/json:
              schema:
                description: True when the livestream is active.
                type: boolean
                example: true
        501:
          description: Not implemented for this device.
    put:
      operationId: startLivestream
      tags:
        - Livestream
      summary: Start the livestream.
      description: Starts the livestream with the currently configured settings.
      responses:
        204:
          description: Livestream started.
        501:
          description: Not implemented for this device.
  /livestreams/0/stop:
    get:
      operationId: getLivestreamStop
      summary: Determine if the livestream is inactive.
      description: Returns true if the livestream is currently stopped.
      tags:
        - Livestream
      responses:
        200:
          description: Livestream inactive status.
          content:
            application/json:
              schema:
                description: True when the livestream is inactive.
                type: boolean
                example: true
        501:
          description: Not implemented for this device.
    put:
      operationId: stopLivestream
      tags:
        - Livestream
      summary: Stop the livestream.
      description: Stops the currently running livestream.
      responses:
        204:
          description: Livestream stopped.
        501:
          description: Not implemented for this device.
  /livestreams/0/available:
    get:
      operationId: getLivestreamAvailable
      summary: Check if livestreaming is currently available.
      description: Returns livestreaming availability status and reasons if unavailable.
      tags:
        - Livestream
      responses:
        200:
          description: Livestreaming availability status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamingAvailability"
        501:
          description: Not implemented for this device.
  /livestreams/0/activePlatform:
    get:
      operationId: getLivestreamActivePlatform
      summary: Get the currently selected platform configuration for the livestream.
      description: Returns the active platform, server, quality, and other configuration details.
      tags:
        - Livestream
      responses:
        200:
          description: Livestream active platform configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivePlatformConfiguration"
        501:
          description: Not implemented for this device.
    put:
      operationId: setLivestreamActivePlatform
      summary: Set the currently selected platform configuration for the livestream.
      description: Updates the platform, server, quality, and other configuration details for the livestream.
      tags:
        - Livestream
      requestBody:
        description: Update the livestream's active platform configuration.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivePlatformConfiguration"
      responses:
        204:
          description: Livestream active platform configuration updated.
        400:
          description: Bad Request - invalid configuration.
        501:
          description: Not implemented for this device.
  /livestreams/platforms:
    get:
      operationId: getLivestreamPlatforms
      summary: Get the list of available platforms.
      description: Returns an array of platform names that can be used for livestreaming.
      tags:
        - Livestream
      responses:
        200:
          description: List of available platforms.
          content:
            application/json:
              schema:
                type: array
                description: List of available platforms names.
                items:
                  type: string
                  description: Platform name.
                  example: Facebook
        501:
          description: Not implemented for this device.
  /livestreams/platforms/{platformName}:
    get:
      operationId: getLivestreamPlatform
      summary: Get the service configuration for a platform.
      description: Returns detailed configuration information for the specified platform.
      tags:
        - Livestream
      parameters:
        - $ref: '#/components/parameters/platformName'
      responses:
        200:
          description: Service configuration for specified platform.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformService"
        400:
          description: Bad Request - invalid platform name.
        404:
          description: Platform not found.
        501:
          description: Not implemented for this device.
  /livestreams/customPlatforms:
    get:
      operationId: getLivestreamCustomPlatforms
      summary: Get a list of custom platform files.
      description: Returns an array of filenames for custom platform configurations.
      tags:
        - Livestream
      responses:
        200:
          description: List of custom platform files.
          content:
            application/json:
              schema:
                description: List of custom platform file names.
                type: array
                items:
                  type: string
                  description: Custom platform file name.
                  example: Custom.xml
        204:
          description: No custom platforms available.
        501:
          description: Not implemented for this device.
    delete:
      operationId: deleteLivestreamCustomPlatforms
      tags:
        - Livestream
      summary: Remove all custom configuration files.
      description: Deletes all custom platform configuration files.
      responses:
        204:
          description: All custom configuration files removed.
        501:
          description: Not implemented for this device.
  /livestreams/customPlatforms/{filename}:
    get:
      operationId: getLivestreamCustomPlatform
      summary: Get a custom platform file.
      description: Returns the XML content of a specific custom platform configuration file.
      tags:
        - Livestream
      parameters:
        - $ref: '#/components/parameters/customPlatformFilename'
      responses:
        200:
          description: Custom platform file.
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/streaming"
        404:
          description: File not found.
        501:
          description: Not implemented for this device.
    put:
      operationId: setLivestreamCustomPlatform
      summary: Update a custom platform file if it exists, if not, create a new file with the given file name.
      description: Creates or updates a custom platform configuration file with the provided XML content.
      tags:
        - Livestream
      parameters:
        - $ref: '#/components/parameters/customPlatformFilename'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/streaming"
      responses:
        204:
          description: Custom platform file created or updated.
        400:
          description: Bad Request - invalid filename or XML content.
        501:
          description: Not implemented for this device.
    delete:
      operationId: deleteLivestreamCustomPlatform
      summary: Remove the given custom platform file.
      description: Deletes a specific custom platform configuration file.
      tags:
        - Livestream
      parameters:
        - $ref: '#/components/parameters/customPlatformFilename'
      responses:
        204:
          description: Custom platform file removed.
        404:
          description: File not found.
        501:
          description: Not implemented for this device.
components:
  parameters:
    platformName:
      in: path
      name: platformName
      required: true
      description: Name of the platform. Obtainable from GET /livestreams/platforms.
      example: Facebook
      schema:
        type: string
        pattern: '^[^\x00-\x1F"/:*?<>|]+'
      x-bmd-list-source:
        from: /livestreams/platforms
        pointer: ""
        extract: items
    customPlatformFilename:
      in: path
      name: filename
      required: true
      description: Name of the custom platform file. Obtainable from GET /livestreams/customPlatforms.
      example: Custom.xml
      schema:
        type: string
        pattern: '^[^\x00-\x1F"/:*?<>|]+\.[a-zA-Z0-9]+'
      x-bmd-list-source:
        from: /livestreams/customPlatforms
        pointer: ""
        extract: items

  schemas:
    LivestreamStatus:
      type: object
      required: [status, bitrate, effectiveVideoFormat]
      properties:
        status:
          type: string
          enum:
            - Idle
            - Connecting
            - Streaming
            - Flushing
            - Interrupted
          example: Idle
        bitrate:
          type: integer
          description: Current bitrate (bps).
          example: 123456789
        effectiveVideoFormat:
          type: string
          description: Effective video format for the livestream, serialised as a string.
          example: 1280x720p30
        duration:
          type: integer
          description: Current stream duration in seconds. Absent if livestream is idle.
          example: 1234
        cache:
          type: number
          description: Current stream cache usage percentage.
          example: 7
    StreamingAvailability:
      type: object
      required: [available, reasons]
      properties:
        available:
          type: boolean
          description: True if livestreaming is currently available.
          example: true
        reasons:
          type: array
          description: Reasons why livestreaming is unavailable (empty if available is true).
          items:
            type: string
            enum:
              - not-supported
              - unsupported-format
              - in-playback
              - pending-format-transition
              - unexpected-reason
          example: []
    ActivePlatformConfiguration:
      type: object
      description: Livestream's current active platform configuration.
      required: [platform, server, quality]
      properties:
        platform:
          type: string
          description: Platform name.
          example: Youtube SRT (Beta)
        server:
          type: string
          description: The platform's server name, or "Custom" when the URL is customizable.
          example: Primary
        key:
          type: string
          description: Stream key. Assumed to be empty if missing.
          example: ABCDEF-GHIJKL-MNOPQR
        passphrase:
          type: string
          description: Passphrase. Only included for SRT streams.
          example: pp-abcd-efgh-ijkl-mnop
        quality:
          type: string
          description: Quality level name.
          example: Streaming High
        url:
          type: string
          description: Livestream destination. Only included when URL is customizable.
          example: rtmp://192.168.0.1/app
    PlatformService:
      type: object
      description: Livestream platform service configuration.
      required: [platform, servers, profiles]
      properties:
        platform:
          type: string
          description: Corresponding platform name.
          example: YouTube
        key:
          type: string
          description: Default stream key.
          example: exampleKey123
        servers:
          type: array
          description: List of server configurations.
          items:
            $ref: "#/components/schemas/ServerConfiguration"
        profiles:
          type: array
          description: List of profile configurations.
          items:
            $ref: "#/components/schemas/ProfileConfiguration"
        defaultProfile:
          type: string
          description: Quality level name.
          example: Streaming High
        credentials:
          type: object
          required: [username, password]
          description: Credientials used for RTMP streams.
          properties:
            username:
              type: string
              description: The username part of the creditials. Only used for RTMP streams.
              example: myusername
            password:
              type: string
              description: Used for RTMP streams, also used as Passphrase for SRT streams.
              example: mypassword
        customizableUrlEnabled:
          type: boolean
          description: True when the server URL is customizable.
          example: false
    ServerConfiguration:
      type: object
      description: Server configuration.
      required: [server, url]
      properties:
        server:
          type: string
          description: Server name.
          example: Primary
        url:
          type: string
          description: Livestream destination.
          example: srt://a.srt.youtube.com:2010
        srtExtensions:
          type: array
          description: Miscellaneous tags used for SRT livestreams.
          items:
            type: object
            description: Dictionary object mapping SRT tag strings to values.
            additionalProperties:
              type: string
              description: "SRT tag value."
            example:
              "copy": "1"
        group:
          type: string
          description: Logical grouping of the server.
          example: Primary
    ProfileConfiguration:
      type: object
      description: Quality configuration.
      required: [profile, configs, lowLatency]
      properties:
        profile:
          type: string
          description: Quality level name.
          example: Streaming High
        configs:
          type: array
          description: List of video format configurations.
          items:
            $ref: "#/components/schemas/ProfileFormatConfiguration"
        lowLatency:
          type: boolean
          description: If true, fewer frames will be buffered in the livestream.
    ProfileFormatConfiguration:
      type: object
      description: Video format configuration for profiles.
      required: [resolution, fps, bitrate]
      properties:
        resolution:
          type: string
          description: Video format serialised as a string.
          example: 1080p
        fps:
          type: string
          description: Frames per second.
          example: 60
        bitrate:
          type: integer
          description: Pixel bitrate (bps).
          example: 9000000
        audioBitrate:
          type: integer
          description: Audio bitrate (bps).
          example: 128000
        keyFrameInterval:
          type: integer
          description: How often a key frame is sent, in seconds.
          example: 2
        videoCodecs:
          type: array
          description: Supported video encoding algorithm/s.
          items:
            type: string
            description: Video encoding algorithm.
            enum:
              - H264
              - H265
            example: H264
    streaming:
      type: object
      description: Blackmagic streaming XML file format.
