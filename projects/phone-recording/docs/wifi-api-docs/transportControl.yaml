openapi: 3.0.1
info:
  title: Transport Control API
  description: API for controlling Transport on Blackmagic Design products.
  version: 1.2.0
servers:
- url: /control/api/v1
tags:
  - name: Transport
    description: Transport Control API
paths:
  /transports/0:
    get:
      operationId: getTransport
      tags:
      - Transport
      summary: Get device's basic transport status.
      responses:
        200:
          description: Transport status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportResponse'
    put:
      operationId: setTransport
      summary: Set device's basic transport status.
      tags:
      - Transport
      requestBody:
          description: Set the transport mode.
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - mode
                properties:
                  mode:
                    type: string
                    description: Transport mode.
                    example: InputPreview
                    enum:
                    - InputPreview
                    - Output
      responses:
        204:
          description: Transport mode was set.
        400:
          description: Failed to set transport mode or invalid state.
        500:
          description: Internal server error.
  /transports/0/stop:
    get:
      operationId: getTransportStop
      summary: Determine if transport is stopped.
      tags:
      - Transport
      responses:
        200:
          description: Transport stop response.
          content:
            application/json:
              schema:
                description: True when transport mode is InputPreview or when in Output mode and speed is 0.
                type: boolean
    put:
      operationId: stopTransportDeprecated
      summary: Stop transport (DEPRECATED).
      description: This endpoint is deprecated and will be removed in a future version. Please use POST /transports/0/stop instead.
      deprecated: true
      tags:
      - Transport
      responses:
        204:
          description: Transport stopped.
        500:
          description: Internal server error.
    post:
      operationId: stopTransport
      summary: Stop transport.
      tags:
      - Transport
      responses:
        204:
          description: Transport stopped.
        500:
          description: Internal server error.
  /transports/0/play:
    get:
      operationId: getTransportPlay
      summary: Determine if transport is playing.
      tags:
      - Transport
      responses:
        200:
          description: Transport play response.
          content:
            application/json:
              schema:
                description: True when transport is in Output mode and speed is non-zero.
                type: boolean
    put:
      operationId: playTransportDeprecated
      summary: Start playing on transport (DEPRECATED).
      description: This endpoint is deprecated and will be removed in a future version. Please use POST /transports/0/play instead.
      deprecated: true
      tags:
      - Transport
      responses:
        204:
          description: Transport playing.
        400:
          description: Failed to set transport to play.
        500:
          description: Internal server error.
    post:
      operationId: playTransport
      summary: Start playing on transport.
      description: Starts playback on the transport
      tags:
      - Transport
      responses:
        204:
          description: Transport playing.
        400:
          description: Failed to set transport to play.
        500:
          description: Internal server error.
  /transports/0/playback:
    get:
      operationId: getTransportPlayback
      summary: Get playback state.
      tags:
      - Transport
      responses:
        200:
          description: Transport playback state.
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Playback'
    put:
      operationId: setTransportPlayback
      summary: Set playback state.
      description: Updates playback state. Applies remote timeline selection if GET /timelines/0/selection has a non-empty timeline selection.
      tags:
      - Transport
      requestBody:
        description: Update playback state.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Playback'
      responses:
        204:
          description: Updated transport playback state.
        400:
          description: Failed to set transport playback state.
        500:
          description: Internal server error.
  /transports/0/record:
    get:
      operationId: getTransportRecord
      summary: Get record state.
      tags:
      - Transport
      responses:
        200:
          description: Recording state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecord'
    put:
      operationId: setTransportRecordDeprecated
      summary: Set record state (DEPRECATED).
      description: This endpoint is deprecated and will be removed in a future version. Please use POST /transports/0/record instead.
      deprecated: true
      tags:
      - Transport
      requestBody:
        description: Update record state.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRecord'
      responses:
        204:
          description: Recording state updated.
        400:
          description: Failed to update recording state.
        500:
          description: Internal server error.
    post:
      operationId: startTransportRecord
      summary: Start recording.
      tags:
      - Transport
      requestBody:
        description: Optional additional recording information, omit request body to use device defaults.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Record'
      responses:
        204:
          description: Recording started.
        400:
          description: Failed to start recording.
        500:
          description: Internal server error.
  /transports/0/clipIndex:
    get:
      operationId: getTransportClipIndex
      summary: Get the clip index of the currently playing clip on the timeline.
      tags:
      - Transport
      responses:
        200:
          description: Clip index response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipIndex'
              examples:
                NoOrEmptyTimeline:
                  value:
                    clipIndex: null
                PlayingFirstClip:
                  value:
                    clipIndex: 0
                PlayingSecondClip:
                  value:
                    clipIndex: 1
  /transports/0/timecode:
    get:
      operationId: getTransportTimecode
      summary: Get device timecode.
      tags:
      - Transport
      responses:
        200:
          description: Timecode response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timecode'
  /transports/0/timecode/source:
    get:
      operationId: getTransportTimecodeSource
      summary: Get timecode source selected on device.
      tags:
      - Transport
      responses:
        200:
          description: Timecode source response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimecodeSource'
  /transports/0/proxyRecording:
    get:
      operationId: getTransportProxyRecording
      summary: Get proxy recording configuration.
      description: Returns whether proxy recording (secondary recording) is currently enabled.
      tags:
      - Transport
      responses:
        200:
          description: Proxy recording configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyRecording'
        404:
          description: The device does not support proxy recording.
    put:
      operationId: setTransportProxyRecording
      summary: Set proxy recording configuration.
      description: Enable or disable proxy recording (secondary recording).
      tags:
      - Transport
      requestBody:
        description: Proxy recording configuration.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRecording'
      responses:
        204:
          description: Proxy recording configuration updated successfully.
        400:
          description: Invalid request body.
        500:
          description: Failed to set proxy recording configuration.
        404:
          description: The device does not support proxy recording.
components:
  schemas:
    TransportResponse:
      type: object
      properties:
        mode:
          example: InputPreview
          type: string
          description: Transport mode.
          enum:
          - InputPreview
          - InputRecord
          - Output
    Playback:
      type: object
      properties:
        type:
          example: Play
          type: string
          enum:
          - Play
          - Jog
          - Shuttle
          - Var
        loop:
          example: false
          type: boolean
          description: When true, playback loops from the end of the timeline to the beginning of the timeline.
        singleClip:
          example: false
          type: boolean
          description: When true, playback loops from the end of the current clip to the beginning of the current clip.
        speed:
          example: 1.0
          type: number
          format: float
          description: Playback speed, 1.0 for normal forward playback.
        position:
          example: 0
          type: integer
          description: Playback position on the timeline in units of video frames, where 0 is the first frame of the timeline.
    GetRecord:
      type: object
      properties:
        recording:
          type: boolean
          example: true
          description: If true, transport is in InputRecord mode.
    PutRecord:
      type: object
      required:
        - recording
      properties:
        recording:
          type: boolean
          description: If true, starts a recording, otherwise stops.
        clipName:
          type: string
          example: ClipName.mov
          description: Optional, sets the requested clip name to record to, when "recording" attribute is set to true.
    Record:
      type: object
      properties:
        clipName:
          type: string
          example: ClipName.mov
          description: Optional, provides a specific name of clip to record to.
    ClipIndex:
      type: object
      properties:
        clipIndex:
          nullable: true
          type: integer
          description: The 0-based index of the clip being played on the timeline. null when there is no timeline or an empty timeline.
    Timecode:
      type: object
      properties:
        display:
          type: string
          description: The display timecode serialised as a string.
          example: 00:00:03:22
        timeline:
          type: string
          description: The timeline timecode serialised as a string.
          example: 00:00:03:22
    TimecodeSource:
      type: object
      properties:
        source:
          type: string
          enum:
          - Timeline
          - Clip
          description: Selected timecode source.
        timecodeInputSource:
          type: string
          enum:
          - Internal
          - Embedded
          - External
          - TimeOfDay
          - Preset
          - LastClip
          - Unknown
          description: Selected timecode input source.
    ProxyRecording:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Enable or disable proxy recording.
          example: true
