name: JARVIS
options:
  bundleIdPrefix: com.operation-jarvis
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  JARVISKit:
    path: JARVISKit

targets:
  JARVIS:
    type: application
    platform: iOS
    sources:
      - path: JARVIS
        excludes:
          - "Info.plist"
    dependencies:
      - package: JARVISKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.operation-jarvis.jarvis
        INFOPLIST_FILE: JARVIS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO

  JARVISWatch:
    type: application
    platform: watchOS
    sources:
      - path: JARVISWatch
        excludes:
          - "Info.plist"
    dependencies:
      - package: JARVISKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.operation-jarvis.jarvis.watch
        INFOPLIST_FILE: JARVISWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

schemes:
  JARVIS:
    build:
      targets:
        JARVIS: all
    run:
      config: Debug
  JARVISWatch:
    build:
      targets:
        JARVISWatch: all
    run:
      config: Debug
