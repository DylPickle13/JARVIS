name: JARVIS
options:
  bundleIdPrefix: com.operation-jarvis
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  postGenCommand: ./scripts/patch-watch-embedding.sh

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "109"
    CODE_SIGN_STYLE: Automatic

packages:
  JARVISKit:
    path: JARVISKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    exactVersion: 0.15.0
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.101.3

targets:
  JARVIS:
    type: application
    platform: iOS
    sources:
      - path: JARVIS
        excludes:
          - "Info.plist"
      - path: HostAppIntents
    dependencies:
      - package: JARVISKit
      - package: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - target: JARVISWatch
        platforms: [iOS]
        platformFilter: iOS
        embed: true
      - target: JARVISWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.operation-jarvis.jarvis
        INFOPLIST_FILE: JARVIS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO

  JARVISWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: JARVISWidget
        excludes:
          - "Info.plist"
      - path: WidgetShared
      - path: SharedAppIntents
    dependencies:
      - package: JARVISKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.operation-jarvis.jarvis.widget
        INFOPLIST_FILE: JARVISWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"

  JARVISWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: JARVISWatchWidget
        excludes:
          - "Info.plist"
      - path: WidgetShared
      - path: SharedAppIntents
    dependencies:
      - package: JARVISKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.operation-jarvis.jarvis.watchkitapp.widget
        INFOPLIST_FILE: JARVISWatchWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES

  JARVISTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JARVISTests
    dependencies:
      - target: JARVIS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.operation-jarvis.jarvis.tests
        GENERATE_INFOPLIST_FILE: YES

  JARVISWatch:
    type: application
    platform: watchOS
    sources:
      - path: JARVISWatch
        excludes:
          - "Info.plist"
      - path: HostAppIntents
    dependencies:
      - package: JARVISKit
      - target: JARVISWatchWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.operation-jarvis.jarvis.watchkitapp
        PRODUCT_NAME: JARVISWatch
        INFOPLIST_FILE: JARVISWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
        GENERATE_PKGINFO_FILE: YES
        SDKROOT: watchos
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        WRAPPER_EXTENSION: app
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

schemes:
  JARVIS:
    build:
      targets:
        JARVIS: all
    test:
      targets:
        - JARVISTests
    run:
      config: Debug
  JARVISWatch:
    build:
      targets:
        JARVISWatch: all
    run:
      config: Debug
