# Isolated tmux profile used by the JARVIS iPhone Pi terminal.
set -g default-terminal "tmux-256color"
set-environment -g COLORTERM "truecolor"
set-environment -g LANG "en_US.UTF-8"
# SwiftTerm supports OSC 8. Advertise it for the iPhone's SSH PTY so tmux
# preserves formatted links' hidden destinations instead of stripping them.
set -as terminal-features ",xterm-256color:RGB:extkeys:hyperlinks"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g mouse on
# Pi regular mode uses main-screen terminal history. Keep tmux's mouse/copy-mode
# fallback at one-line granularity instead of its five-line default so mobile
# scrolling remains predictable.
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
set -g focus-events on
set -g status off
set -sg escape-time 10
set -g history-limit 100000
set -g window-size latest

# Regular-mode Pi repaints live rows; tmux's copy buffer otherwise freezes them.
# A single worker exists only during copy mode, preserves the history anchor,
# and skips selections / incomplete synchronized-output frames. No Pi input,
# resize, status bar, fullscreen mode, or change to the Watch's live capture.
set -g @jarvis-copy-refresh-enabled on
set-hook -g after-copy-mode[90] 'run-shell -b "/usr/bin/python3 /Users/dylanrapanan/JARVIS/projects/operation-jarvis/jarvis-app/scripts/jarvis-mobile-copy-refresh.py --socket #{q:socket_path} --server-pid #{pid}"'
# Also cover a copy view already open when an attachment reloads this profile.
run-shell -b '/usr/bin/python3 /Users/dylanrapanan/JARVIS/projects/operation-jarvis/jarvis-app/scripts/jarvis-mobile-copy-refresh.py --socket #{q:socket_path} --server-pid #{pid}'
