# Isolated tmux profile used by the JARVIS iPhone Pi terminal.
set -g default-terminal "tmux-256color"
set-environment -g COLORTERM "truecolor"
set-environment -g LANG "en_US.UTF-8"
set -as terminal-features ",xterm-256color:RGB:extkeys"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g mouse on
# Pi regular mode uses main-screen terminal history. Keep tmux's mouse/copy-mode
# fallback at one-line granularity instead of its five-line default so mobile
# scrolling remains predictable.
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
set -g focus-events on
set -g status off
set -sg escape-time 10
set -g history-limit 100000
set -g window-size latest
