set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB'
set -sg escape-time 10
# Match VS Code/xterm.js per-codepoint cell widths. tmux 3.7 clusters Indic
# spacing vowel signs (e.g. বাংলা = 2 cells) and widens emoji+VS16 (⚠️ = 2);
# xterm.js counts 5 and 1. That drift overflowed the bottom-right cell, wrapping
# and scrolling the whole outer terminal (lost header, garbage bottom rows).
# Every Unicode 16 spacing mark (category Mc) is one cell, as in xterm.js.
set -s variation-selector-always-wide off
set -s codepoint-widths "\
