set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB'
set -sg escape-time 10
set -g base-index 0
set -g pane-base-index 0
set -g remain-on-exit on
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-style 'bg=#000000,fg=colour245'
set -g pane-border-status top
set -g pane-border-format '#[fg=#{?pane_active,#D183E8,colour245}]#[#{?pane_active,bold,nobold}] Session #{@pi-desk-session} #[default]'
set -g pane-border-style 'fg=colour240,bg=#000000'
set -g pane-active-border-style 'fg=#D183E8,bg=#000000'
set -g window-style 'bg=#000000'
set -g window-active-style 'bg=#000000'
set-hook -g client-attached 'select-layout even-horizontal'
set-hook -g client-resized 'select-layout even-horizontal'
# The selector is status chrome, never a fourth navigable pane.
# Maintenance is explicit, confirmed, and uses the host's fail-closed helper.
bind -n F10 display-popup -E -w 90% -h 80% '"$HOME/.local/bin/pi-desk" restart'
bind R display-popup -E -w 90% -h 80% '"$HOME/.local/bin/pi-desk" restart'
bind g command-prompt -N -p 'Session (1-10)' 'run-shell -b "python3 $HOME/.local/share/pi-desk/desktop.py select %% #{client_pid}"'
bind -n C-Left run-shell -b 'python3 "$HOME/.local/share/pi-desk/navigate.py" -1 "#{client_pid}"'
bind -n C-Right run-shell -b 'python3 "$HOME/.local/share/pi-desk/navigate.py" 1 "#{client_pid}"'
bind Left run-shell -b 'python3 "$HOME/.local/share/pi-desk/navigate.py" -1 "#{client_pid}"'
bind Right run-shell -b 'python3 "$HOME/.local/share/pi-desk/navigate.py" 1 "#{client_pid}"'
bind C-Left run-shell -b 'python3 "$HOME/.local/share/pi-desk/navigate.py" -1 "#{client_pid}"'
bind C-Right run-shell -b 'python3 "$HOME/.local/share/pi-desk/navigate.py" 1 "#{client_pid}"'
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
bind -n F12 command-prompt -N -p 'Session (1-10)' 'run-shell -b "python3 $HOME/.local/share/pi-desk/desktop.py select %% #{client_pid}"'
bind -n MouseDown1Status run-shell -b 'python3 "$HOME/.local/share/pi-desk/desktop.py" click "#{mouse_status_range}" "#{client_pid}"'
