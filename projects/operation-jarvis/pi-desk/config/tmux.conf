set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB'
set -sg escape-time 10
set -g base-index 0
set -g pane-base-index 0
set -g remain-on-exit on
set -g status 2
set -g status-position top
set -g status-interval 2
set -g status-style 'bg=#000000,fg=colour245'
set -g status-format[0] ' Pi Desk · Connecting…'
set -g status-format[1] ' F12: select session | Ctrl+Left/Right: previous/next session'
set -g pane-border-status top
set -g pane-border-format '#[fg=#{?pane_active,cyan,colour245}]#[#{?pane_active,bold,nobold}] Session #{@pi-desk-session} #[default]'
set -g pane-border-style 'fg=colour240,bg=#000000'
set -g pane-active-border-style 'fg=cyan,bg=#000000'
set -g window-style 'bg=#000000'
set -g window-active-style 'bg=#000000'
# The selector is status chrome, never a fourth navigable pane.
bind -n C-Left run-shell -b 'python3 "$HOME/.local/share/pi-desk/desktop.py" step -1 "#{client_pid}"'
bind -n C-Right run-shell -b 'python3 "$HOME/.local/share/pi-desk/desktop.py" step 1 "#{client_pid}"'
bind Left run-shell -b 'python3 "$HOME/.local/share/pi-desk/desktop.py" step -1 "#{client_pid}"'
bind Right run-shell -b 'python3 "$HOME/.local/share/pi-desk/desktop.py" step 1 "#{client_pid}"'
bind C-Left run-shell -b 'python3 "$HOME/.local/share/pi-desk/desktop.py" step -1 "#{client_pid}"'
bind C-Right run-shell -b 'python3 "$HOME/.local/share/pi-desk/desktop.py" step 1 "#{client_pid}"'
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
bind -n F12 command-prompt -N -p 'Session (1-10)' 'run-shell -b "python3 $HOME/.local/share/pi-desk/desktop.py select %% #{client_pid}"'
bind -n MouseDown1Status run-shell -b 'python3 "$HOME/.local/share/pi-desk/desktop.py" select "#{mouse_status_range}" "#{client_pid}"'
