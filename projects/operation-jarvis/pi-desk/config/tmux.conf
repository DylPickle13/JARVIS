set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB'
set -sg escape-time 10
set -g base-index 0
set -g pane-base-index 0
set -g remain-on-exit on
set -g status on
set -g status-position top
# Name the outer terminal tab, not individual coding panes. tmux restores the
# previous terminal title on detach; keep agent titles out of the viewer's name.
set -g set-titles on
set -g set-titles-string 'pi-desk'
set -g status-interval 2
set -g status-style 'bg=#1e1e1e,fg=colour245'
set -g pane-border-status top
set -g pane-border-lines heavy
# Keep tmux's shared junctions neutral: focus belongs to the tab/title badge,
# not an incomplete outline or the default half-coloured two-pane divider.
set -g pane-border-indicators off
# Keep white titles above VS Code's default 4.5:1 contrast correction threshold.
set -g pane-border-format '#[default] #[fg=##ffffff,bg=#{?pane_active,##8D4CA3,##1e1e1e},#{?pane_active,bold,nobold}] Session #{@pi-desk-session} #[default] '
# Use one exact RGB grey for title-row lines, junctions and vertical dividers.
# Its 4.83:1 contrast stays above VS Code's default adjustment threshold.
set -g pane-border-style 'fg=#8a8a8a,bg=#1e1e1e'
set -g pane-active-border-style 'fg=#8a8a8a,bg=#1e1e1e'
set -g window-style 'bg=#1e1e1e'
set -g window-active-style 'bg=#1e1e1e'
# tmux adjusts geometry immediately; the viewer's debounced terminal-size
# watcher reconciles 1/2/3-session membership without spawning per resize event.
set-hook -g client-attached 'select-layout even-horizontal'
set-hook -g client-resized 'select-layout even-horizontal'
# The selector is status chrome, never a fourth navigable pane.
# Maintenance is explicit, confirmed, and uses the host's fail-closed helper.
# run-shell displays output/nonzero exits in a pane's view-mode, even with -b.
# Keep shortcut diagnostics in a log; real failures remain in restart-status.
bind -n F10 confirm-before -p 'Restart all ten agents when idle? (y/n)' 'run-shell -b "\"$HOME/.local/bin/pi-desk\" restart --confirmed --client \"#{client_name}\" >>\"$HOME/.local/state/pi-desk/restart-dispatch.log\" 2>&1 || true"'
bind R confirm-before -p 'Restart all ten agents when idle? (y/n)' 'run-shell -b "\"$HOME/.local/bin/pi-desk\" restart --confirmed --client \"#{client_name}\" >>\"$HOME/.local/state/pi-desk/restart-dispatch.log\" 2>&1 || true"'
bind g command-prompt -N -p 'Session (1-10)' 'run-shell -b "python3 $HOME/.local/share/pi-desk/desktop.py select %% #{client_pid}"'
bind -n C-Left run-shell -b 'python3 "$HOME/.local/share/pi-desk/navigate.py" -1 "#{client_pid}"'
bind -n C-Right run-shell -b 'python3 "$HOME/.local/share/pi-desk/navigate.py" 1 "#{client_pid}"'
bind Left run-shell -b 'python3 "$HOME/.local/share/pi-desk/navigate.py" -1 "#{client_pid}"'
bind Right run-shell -b 'python3 "$HOME/.local/share/pi-desk/navigate.py" 1 "#{client_pid}"'
bind C-Left run-shell -b 'python3 "$HOME/.local/share/pi-desk/navigate.py" -1 "#{client_pid}"'
bind C-Right run-shell -b 'python3 "$HOME/.local/share/pi-desk/navigate.py" 1 "#{client_pid}"'
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
# Remove the old root binding when reloading an existing server.
unbind -n F12
bind -n MouseDown1Status if-shell -F -t '{active}' '#{==:#{pane_mode},copy-mode}' { send-keys -t '{active}' -X cancel } \; run-shell -b 'python3 "$HOME/.local/share/pi-desk/desktop.py" click "#{mouse_status_range}" "#{client_pid}"'

# Browser-style selection belongs to this viewer, not the nested agent tmux.
# Always snapshot the outer pane on drag, even when its app requests mouse input.
# This freezes only the displayed grid; the attachment and agent keep running.
bind -n MouseDown1Pane if-shell -F -t '{active}' '#{==:#{pane_mode},copy-mode}' { send-keys -t '{active}' -X cancel } \; select-pane -t = \; send-keys -M
bind -n MouseDrag1Pane select-pane -t = \; copy-mode -HM
bind -n DoubleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-word
bind -n TripleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-line
bind -n MouseDown1Border if-shell -F -t '{active}' '#{==:#{pane_mode},copy-mode}' { send-keys -t '{active}' -X cancel } \; resize-pane -M
# Blank status areas dismiss too, without navigating or opening a menu.
bind -n MouseDown1StatusLeft if-shell -F -t '{active}' '#{==:#{pane_mode},copy-mode}' { send-keys -t '{active}' -X cancel }
bind -n MouseDown1StatusRight if-shell -F -t '{active}' '#{==:#{pane_mode},copy-mode}' { send-keys -t '{active}' -X cancel }

bind -T copy-mode MouseDown1Pane send-keys -t '{active}' -X cancel \; select-pane -t = \; send-keys -M
bind -T copy-mode-vi MouseDown1Pane send-keys -t '{active}' -X cancel \; select-pane -t = \; send-keys -M
bind -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode DoubleClick1Pane send-keys -X select-word
bind -T copy-mode-vi DoubleClick1Pane send-keys -X select-word
bind -T copy-mode TripleClick1Pane send-keys -X select-line
bind -T copy-mode-vi TripleClick1Pane send-keys -X select-line
# Enter is dismissal, not a surprising implicit copy. Escape also cancels.
bind -T copy-mode Enter send-keys -X cancel
bind -T copy-mode-vi Enter send-keys -X cancel

# The optional VS Code bridge sends a dedicated key for Cmd+C only in a
# pi-desk terminal without a native selection. No selection is a strict no-op.
set -s user-keys[90] "\e[9001~"
bind -n User90 if-shell -F '0' { send-keys User90 }
bind -T copy-mode User90 if-shell -F '#{selection_present}' { send-keys -X copy-pipe-no-clear }
bind -T copy-mode-vi User90 if-shell -F '#{selection_present}' { send-keys -X copy-pipe-no-clear }
# macOS's actual clipboard avoids OSC 52 being swallowed by nested terminals.
# Other platforms retain tmux's normal clipboard transport; no global settings.
if-shell 'test -x /usr/bin/pbcopy' { set -s copy-command '/usr/bin/pbcopy' }
