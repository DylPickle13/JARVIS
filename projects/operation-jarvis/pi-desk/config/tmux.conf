set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB'
set -sg escape-time 10
set -g base-index 0
set -g pane-base-index 0
set -g remain-on-exit on
set -g status-style 'bg=#000000,fg=white'
set -g status-left ' Pi Desk '
set -g status-right ' F12: menu | Ctrl+A arrows: pane '
set -g pane-border-status top
set -g pane-border-format ' Session #{@pi-desk-session} '
set -g pane-border-style 'fg=colour240,bg=#000000'
set -g pane-active-border-style 'fg=cyan,bg=#000000'
set -g window-style 'bg=#000000'
set -g window-active-style 'bg=#000000'
bind-key -n F12 detach-client
