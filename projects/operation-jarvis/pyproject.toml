[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "operation-jarvis"
version = "0.1.0"
description = "Private room audio, Google Cast, smart-plug, purifier, and native JARVIS project"
requires-python = ">=3.9"
dependencies = [
  "PyChromecast==13.1.0",
  "yt-dlp",
  "urllib3<2",
  "requests==2.33.1",
  "huggingface_hub==1.14.0",
  "piper-tts==1.4.2",
]

[project.scripts]
operation-jarvis = "jarvis:main"

[tool.setuptools]
py-modules = ["jarvis"]
include-package-data = false
