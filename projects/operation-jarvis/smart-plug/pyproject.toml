[project]
name = "jarvis-smart-plug"
version = "0.1.0"
description = "Local control utilities for Kasa HS103 smart plugs."
requires-python = ">=3.11"
dependencies = [
  # HS103 hardware v5 uses TP-Link's newer IOT KLAP v2 auth path.
  # Reviewed installed revision; updates require the SDK no-replay suite.
  "python-kasa @ git+https://github.com/python-kasa/python-kasa.git@dd92c05b12c9d55c0bbb7ee75a9352d5689e5f80",
]

[project.scripts]
plugctl = "smart_plug.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
